<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>outro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: 'Inter', sans-serif; color: #f5f5f4;
    background: radial-gradient(60% 45% at 50% 42%, #1a0507 0%, #000 70%); }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 36px; text-align: center; }
  #done { font-size: 30px; letter-spacing: 0.42em; text-transform: uppercase; color: #22c55e; }
  #done b { font-weight: 400; }
  #logo { width: 190px; height: 190px; filter: drop-shadow(0 0 60px rgba(232,35,42,0.65)); }
  #word { font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 104px;
    letter-spacing: 0.24em; margin-left: 0.24em; }
  #tag { font-family: 'Poppins', sans-serif; font-weight: 400; font-size: 44px; }
  #tag em { font-style: normal; color: #e8232a; }
  #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div id="done"><b>✓</b>&nbsp; RIDE COMPLETED</div>
    <svg id="logo" viewBox="0 0 249 248" fill="#EB1D23"><path d="M13.0143 13.5431C8.12897 8.45926 11.732 0 18.7827 0H115.092C128.353 0 141.07 5.26784 150.447 14.6447L213.347 77.5446C232.978 97.1755 232.857 129.04 213.078 148.522L126.737 233.565C117.383 242.778 104.78 247.942 91.6508 247.942H50C22.3858 247.942 0 225.557 0 197.942V185.802C0 158.188 22.3858 135.802 50 135.802H117.757C122.183 135.802 124.426 141.13 121.333 144.296L93.7761 172.51C89.0719 177.326 82.6241 180.041 75.8917 180.041H55.2675C49.7447 180.041 45.2675 184.518 45.2675 190.041V193.704C45.2675 199.227 49.7446 203.704 55.2675 203.704H83.2125C88.5564 203.704 93.6781 201.565 97.4352 197.765L174.079 120.24C177.947 116.328 177.929 110.027 174.039 106.138L119.027 51.1254C115.276 47.3746 110.189 45.2675 104.884 45.2675L47.7592 45.2675C45.038 45.2675 42.4343 44.1585 40.5488 42.1964L21.75 22.6337L13.0143 13.5431Z"/><path d="M166.086 229.873C164.134 227.92 164.134 224.754 166.086 222.802L190.908 197.98C192.861 196.027 196.027 196.027 197.979 197.98L239.406 239.407C242.556 242.557 240.325 247.942 235.871 247.942H186.227C184.901 247.942 183.629 247.415 182.691 246.478L166.086 229.873Z"/></svg>
    <div id="word">RYDYT</div>
    <div id="tag">Ride Smarter. <em>Ride Together.</em></div>
  </div>
  <div id="fade"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id)
  const clamp01 = (v) => Math.max(0, Math.min(1, v))
  const seg = (t, a, b) => clamp01((t - a) / (b - a))
  const easeOut = (p) => 1 - Math.pow(1 - p, 3)

  /* 3s card: elements cascade in, then fade to black at the very end */
  window.seek = function (t) {
    $('done').style.opacity = String(easeOut(seg(t, 0.0, 0.4)))
    const l = easeOut(seg(t, 0.25, 0.8))
    $('logo').style.opacity = String(l)
    $('logo').style.transform = `scale(${0.85 + l * 0.15})`
    $('word').style.opacity = String(easeOut(seg(t, 0.5, 1.0)))
    $('tag').style.opacity = String(easeOut(seg(t, 0.75, 1.25)))
    $('fade').style.opacity = String(seg(t, 2.45, 3.0))
  }
  window.__ready = (async () => { await document.fonts.ready; seek(0); return true })()
</script>
</body>
</html>
